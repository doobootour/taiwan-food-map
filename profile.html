<body>

<header id="site-header" class="scrolled">
  <div class="wrap">
    <a href="/" class="brand">
      <img class="mark" src="assets/images/logo.webp" data-i18n-alt="brand_name" alt="나만 알고 싶은 대만 맛집" />
      <div class="name"><span data-i18n="brand_name">나만 알고 싶은 대만 맛집</span><small data-i18n="brand_tagline">My Secret Taiwan Eats</small></div>
    </a>

    <nav id="site-nav">
      <a href="/" data-i18n="nav_home">홈</a>
      <a href="/#categories" data-i18n="nav_categories">카테고리</a>
      <a href="/#regions" data-i18n="nav_regions">지역</a>
      <a href="/map" data-i18n="nav_map">지도</a>
      <a href="/profile" class="active" data-i18n="nav_profile">마이페이지</a>
    </nav>

    <div class="header-right">
      <div class="lang-switch">
        <button class="lang-btn" id="langBtn">KO ▾</button>
        <div class="lang-menu" id="langMenu">
          <button data-lang="ko" class="active">한국어</button>
          <button data-lang="en">English</button>
        </div>
      </div>
      <a href="/map" class="btn primary" style="padding:10px 20px;font-size:13px;" data-i18n="btn_register">맛집 등록하기</a>
      <button class="menu-toggle" id="menuToggle" aria-label="메뉴"><span></span></button>
    </div>
  </div>
</header>

<main class="profile-wrap">
  <div class="profile-hero reveal">
    <div class="avatar-circle">🙂</div>
    <div class="level-pill" id="levelPill">신규</div>
    <h2 id="uidDisplay">guest</h2>
    <div class="uid" data-i18n="profile_uid_note">이 브라우저에서 활동 중인 익명 계정이에요</div>
  </div>

  <div class="stat-row reveal">
    <div class="stat-card">
      <div class="num" id="statSubmissions">0</div>
      <div class="lbl" data-i18n="stat_submissions">내가 등록한 맛집</div>
    </div>
    <div class="stat-card sage">
      <div class="num" id="statVotes">0</div>
      <div class="lbl" data-i18n="stat_votes">확인 투표 수</div>
    </div>
  </div>

  <div class="card-block reveal">
    <h3 data-i18n="level_progress_title">등급 진행도</h3>
    <div class="level-track">
      <div class="fill" id="levelFill"></div>
      <div class="dot" style="left:0%"></div>
      <div class="dot" style="left:33.3%"></div>
      <div class="dot" style="left:66.6%"></div>
      <div class="dot" style="left:100%"></div>
    </div>
    <div class="level-labels">
      <span data-i18n="level_new">신규</span><span data-i18n="level_explorer">탐험가</span><span data-i18n="level_local">로컬전문가</span><span data-i18n="level_master">마스터</span>
    </div>
    <div class="level-note" id="levelNote"></div>
  </div>

  <div class="card-block reveal">
    <h3 data-i18n="leaderboard_title">🏆 이달의 기여자</h3>
    <div id="leaderboardList"></div>
  </div>

  <div class="card-block reveal">
    <h3 data-i18n="lang_setting_title">언어 설정</h3>
    <div class="lang-grid-profile" id="langGridProfile"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-bottom">
      <span data-i18n="footer_copyright">© 2026 나만 알고 싶은 대만 맛집</span>
      <a href="/about">소개</a>
      <a href="/privacy">개인정보처리방침</a>
    </div>
  </div>
</footer>
